name: Build and Sign Release APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Generate Release Keystore
      run: |
        keytool -genkeypair -v \
          -keystore app/release.keystore \
          -alias offlinepw_key \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass "OfflinePW_Secure_2026" \
          -keypass "OfflinePW_Secure_2026" \
          -dname "CN=OfflinePW, OU=Security, O=CodeWave, L=Tehran, ST=Tehran, C=IR"

    - name: Build Signed Release APK
      run: gradle assembleRelease --stacktrace --no-daemon

    - name: Prepare APK Output
      run: |
        mkdir -p output_apk
        cp app/build/outputs/apk/release/*.apk output_apk/OfflinePW_1.0.apk

    - name: Upload Signed Release APK
      uses: actions/upload-artifact@v4
      with:
        name: OfflinePW_1.0_Signed
        path: output_apk/OfflinePW_1.0.apk
        if-no-files-found: error
