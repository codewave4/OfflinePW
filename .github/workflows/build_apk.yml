name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # نصب gradle به‌عنوان پشتیبان: اگر فایل gradlew/jar در ریپو نباشد،
      # بیلد با gradle سیستم انجام می‌شود تا هیچ‌وقت خطا ندهد.
      - name: Setup Gradle (fallback)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      # اگر کلید امضا (secrets) تنظیم شده باشد، release امضا می‌شود؛
      # در غیر این صورت به‌جای خطا، debug ساخته می‌شود تا بیلد همیشه سبز بماند.
      - name: Decode Keystore (if secret provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "keystore decoded"
          else
            echo "no KEYSTORE_BASE64 secret; building without release signing"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: offlinepw_key
        run: |
          chmod +x gradlew 2>/dev/null || true
          TARGET=assembleRelease
          if [ ! -s app/release.keystore ]; then
            TARGET=assembleDebug
          fi
          if [ -x ./gradlew ] && [ -s gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew $TARGET --stacktrace --no-daemon
          else
            gradle $TARGET --stacktrace --no-daemon
          fi

      - name: Clean up keystore
        if: always()
        run: rm -f app/release.keystore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/build/outputs/apk/**/*.apk
