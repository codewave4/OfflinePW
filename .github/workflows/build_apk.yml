name: Build and Sign Release APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    # ۱. بازیابی کلید از سکرت
    - name: Decode Keystore from Secret
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > app/release.keystore

    # ۲. تست تشخیصی وضعیت سکرت پسورد (کاملاً امن: فقط اعلام وضعیت و طول رشته)
    - name: Debug Secret Check
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        echo "=== DIAGNOSTIC CHECK ==="
        if [ -z "$KEYSTORE_PASSWORD" ]; then
          echo "❌ KEYSTORE_PASSWORD is EMPTY or NOT FOUND in Secrets!"
        else
          LEN=${#KEYSTORE_PASSWORD}
          echo "✅ KEYSTORE_PASSWORD is PRESENT! Length: $LEN characters."
        fi
        echo "========================"

    # ۳. بیلد نسخه رسمی Release
    - name: Build Signed Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: "offlinepw_key"
      run: |
        gradle assembleRelease \
          -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
          -PKEY_ALIAS="offlinepw_key" \
          --stacktrace --no-daemon

    # ۴. آماده‌سازی خروجی فایل نصبی
    - name: Prepare APK Output
      run: |
        mkdir -p output_apk
        cp app/build/outputs/apk/release/*.apk output_apk/OfflinePW_1.0.apk

    # ۵. آپلود فایل نصبی نهایی
    - name: Upload Signed Release APK
      uses: actions/upload-artifact@v4
      with:
        name: OfflinePW_1.0_Signed
        path: output_apk/OfflinePW_1.0.apk
        if-no-files-found: error
