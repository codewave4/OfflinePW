name: Build and Sign Release APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    # بازیابی کلید ثابت و معتبر از Secrets گیت‌هاب
    - name: Decode Keystore from Secret
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

    # کامپایل رسمی نسخه Release با امضای ثابت
    - name: Build Signed Release APK
      run: gradle assembleRelease --stacktrace --no-daemon

    # آماده‌سازی فایل خروجی نصبی
    - name: Prepare APK Output
      run: |
        mkdir -p output_apk
        cp app/build/outputs/apk/release/*.apk output_apk/OfflinePW_1.0.apk

    # آپلود فایل نهایی Release برای دانلود
    - name: Upload Signed Release APK
      uses: actions/upload-artifact@v4
      with:
        name: OfflinePW_1.0_Signed
        path: output_apk/OfflinePW_1.0.apk
        if-no-files-found: error
