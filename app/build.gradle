plugins {
    id 'com.android.application'
}

// اگر فایل امضای release (که فقط در CI از secrets ساخته می‌شود) موجود نباشد،
// بیلد محلی بدون نیاز به keystore کار می‌کند (فقط امضای debug).
def keystoreExists = file("release.keystore").exists()

android {
    namespace 'com.offlinepw.vault'
    compileSdk 34

    defaultConfig {
        applicationId "com.offlinepw.vault"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (keystoreExists) {
                storeFile file("release.keystore")
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: project.findProperty("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS") ?: project.findProperty("KEY_ALIAS") ?: "offlinepw_key"
                keyPassword System.getenv("KEYSTORE_PASSWORD") ?: project.findProperty("KEYSTORE_PASSWORD")
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreExists ? signingConfigs.release : null
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // امضای debug پیش‌فرض اندروید؛ بدون نیاز به keystore رلیز
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    // sqlcipher 4.5+ برای کامپایل به androidx.sqlite (SupportSQLite*) نیاز دارد
    implementation 'androidx.sqlite:sqlite:2.4.0'
}
